<script type="text/javascript">
    RED.nodes.registerType('konnov-email-validator', {
        category: 'Konnov SDP-241',
        color: '#a6bbcf',
        defaults: {
            name: { value: "" },
            property: { value: "payload", required: true },
            trim: { value: true }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-envelope-o",
        label: function () {
            return this.name || "email validator";
        }
    });
</script>

<script type="text/html" data-template-name="konnov-email-validator">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-property"><i class="fa fa-ellipsis-h"></i> Property</label>
        <input type="text" id="node-input-property" placeholder="payload">
    </div>
    <div class="form-row">
        <label for="node-input-trim" style="width: auto;">
            <input type="checkbox" id="node-input-trim" style="width: auto; vertical-align: top;">

        </label>
    </div>
</script>

<script type="text/html" data-help-name="konnov-email-validator">
    <p>Проверяет, что указанное поле <code>msg</code> — валидный email (упрощённая проверка формата: <code>текст@текст.текст</code>).</p>
    <p><b>Property</b> — какое поле msg проверять (по умолчанию <code>payload</code>).</p>
    <p>Результат кладётся в <code>msg.valid</code> (<code>true</code>/<code>false</code>), исходное значение не меняется.</p>
